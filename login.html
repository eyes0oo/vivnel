<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vivnel</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    <link rel="stylesheet" type="text/css" href="vis_1.0.css">
     <link rel="icon" href="icon.png" type="image/png">

</head>

 <style>
 
 
      body {background-image: url('bg.png'); 
             background-repeat: no-repeat;            
             background-size: cover; 
             background-position: center center;}
.navbar { background-color: #193D3D !important; border-bottom: 3px solid #C197C5; }
        .navbar-brand { color: #C197C5 !important; font-size: 24px; }
        .nav-link { color: #C197C5 !important; }
        .nav-link:hover, .nav-link.active { color: #FFFBDB !important; }
        .form-control { border: 2px solid #878F4B; background: #193D3D; color: #FFFBDB; }
        .form-control::placeholder { color: #878F4B; }
        .btn-outline-success { color: #FFFBDB; border-color: #C197C5; background: #878F4B; }


        .auth-card {
            max-width: 450px;
            margin: 60px auto;
            background: #193D3D;
            border: 4px solid #C197C5;
            border-radius: 15px;
            padding: 40px;
            box-shadow: 0 0 30px rgba(193, 151, 197, 0.3);
        }

        .auth-card h2 {
            color: #C197C5;
            text-align: center;
            margin-bottom: 30px;
            font-family: 'Bicrode', sans-serif;
        }

        .auth-card label {
            color: #FFFBDB;
            margin-bottom: 5px;
        }

        .auth-card .form-control {
            margin-bottom: 20px;
            padding: 12px;
        }

        .btn-submit {
            width: 100%;
            background: #C197C5;
            color: #193D3D;
            border: none;
            padding: 12px;
            border-radius: 25px;
            font-size: 18px;
            font-weight: 600;
            margin-top: 10px;
            transition: all 0.3s;
        }

        .btn-submit:hover {
            background: #FFFBDB;
            transform: scale(1.02);
        }

        .auth-link {
            text-align: center;
            margin-top: 20px;
            color: #FFFBDB;
        }

        .auth-link a {
            color: #C197C5;
            text-decoration: none;
        }

        .auth-link a:hover {
            color: #FFFBDB;
            text-decoration: underline;
        }
    </style>
</head>
<body>

 <nav class="navbar navbar-expand-lg">
    <div class="container-fluid"> <a href="visnel_1.0.html">
        <img src="logo.png" style="width: 55px; height: 55px; margin-right: 10px;"></a>
        <a class="navbar-brand" href="visnel_1.0.html">Vivnel</a>
        <div class="collapse navbar-collapse">
            <ul class="navbar-nav me-auto">
                <li class="nav-item"><a class="nav-link" href="visnel_1.0.html">Главная</a></li>
                <li class="nav-item"><a class="nav-link" href="catalog.html">Каталог</a></li>
            </ul>
        </div>
          <a href="login.html" class="btn btn-login">Вход</a>
                <a href="register.html" class="btn btn-register">Регистрация</a>
    </div>
</nav>

<div class="auth-card">
    <h2>Вход в Vivnel</h2>
    <form>
        <label>Email или логин</label>
        <input type="text" class="form-control" placeholder="your@email.com">
        
        <label>Пароль</label>
        <input type="password" class="form-control" placeholder="••••••••">
        
        <button type="submit" class="btn btn-submit">Войти</button>
    </form>
    <div class="auth-link">
        Нет аккаунта? <a href="register.html">Зарегистрироваться</a>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<footer class="footer mt-5 py-3" >
        <div class="container">
           
                 <div class="footer-content">
                  <div class="footer-left">
                    <a href="oproekte.html">О проекте</a>
                        <span class="separator">|</span>
                    <a href="contacts.html">Контакты</a>
                 </div>
                  <div class="footer-right">
                     Vivnel © 2026
                   </div>
                    </div>
                </div>
 </footer>
</body>
</html>
