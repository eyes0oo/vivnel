    <style>
    /* Стили для самого выпадающего меню */
    .dropdown-menu {
        
    box-shadow: none !important; /* Убирает белую тень */
       background-color: #193D3D;
        border: 1px solid #153333; 
    }

    /* Стили для пунктов меню (ссылок) */
    .dropdown-item {
        color: #bac280; 
        background-color: #153333 ;
    }

    /* Стили для активного (выбранного) элемента */
    .dropdown-item.active {
        color: #86478b;
    }

.dropdown-item:hover,
.dropdown-item:focus,
.dropdown-item:active {
    background-color: #153333 !important; /* Твой темный цвет фона (или чуть светлее, например #3a506b) */
    color: #C197C5 !important;            /* Текст остается белым */
}

/* Если пункт активен (выбран), тоже делаем его темным */
.dropdown-item.active {
    background-color: #2C5E48 !important; /* Цвет для выбранного пункта (например, бирюзовый) */
    color: #FFFBDB !important;
}

    <script>
    document.addEventListener('DOMContentLoaded', function() {
        // 1. БАЗА ДАННЫХ НОВЕЛЛ
        const novelsDB = [
            { id: 'zato', title: 'Z.A.T.O', genre: 'мистика', img: 'картинке нн (моих сыгранных игр)/1dBIos.png' },
            { id: 'meat-girl', title: 'meat girl', genre: 'хоррор', img: 'картинке нн (моих сыгранных игр)/dFjemd.png' },
            { id: 'Mistrick', title: 'Mistrick', genre: 'приключение', img: 'картинке нн (моих сыгранных игр)/HaYsLL.png' },
            { id: 'WitchsBound', title: "Witch's Bound", genre: 'триллер', img: 'картинке нн (моих сыгранных игр)/iHHotf.png' },
            { id: 'SVSATO', title: 'Supervisor Sato! Visual Novel', genre: 'психологический_хоррор', img: 'картинке нн (моих сыгранных игр)/kAW0mj.png' },
            { id: 'FreakCircus', title: 'Freak Circus', genre: 'хоррор', img: 'картинке нн (моих сыгранных игр)/LC5bpl.png' },
            { id: 'PinePoint', title: 'Pine Point: Imsomniac', genre: 'сюрреализм', img: 'картинке нн (моих сыгранных игр)/Oo7JKY.png' },
            { id: 'KYC', title: 'Keeping You Close', genre: 'психологический_хоррор', img: 'картинке нн (моих сыгранных игр)/5AI9GW.png' },
            { id: 'hikeback', title: 'HIKEBACK', genre: 'психологический_хоррор', img: 'картинке нн (моих сыгранных игр)/hikeb head.png' },
            { id: 'Line 88', title: 'Line 88', genre: 'мистика', img: 'картинке нн (моих сыгранных игр)/line 88.png' },
            { id: 'wtdwafef', title: 'What to do with a four-eared fox', genre: 'повседневность', img: 'картинке нн (моих сыгранных игр)/M6tXgJ.png' },
            { id: 'icc', title: 'The ice cream culprit', genre: 'повседневность', img: 'картинке нн (моих сыгранных игр)/ice cream.png' },
            { id: 'gb', title: 'galaxy ballerina', genre: 'романтика', img: 'картинке нн (моих сыгранных игр)/gb.png' },
            { id: 'lilies', title: 'Lilies in the graveyard', genre: 'психологический_хоррор', img: 'картинке нн (моих сыгранных игр)/graveyard.png' },
            { id: 'mush', title: 'Mushroom oasis', genre: 'романтика', img: 'картинке нн (моих сыгранных игр)/mushroom.gif' },
            { id: 'red', title: 'the red house on the third hill..', genre: 'сюрреализм', img: 'картинке нн (моих сыгранных игр)/the red house.jpg' },
            { id: 'WARM LIKE FRESH', title: 'WARM LIKE FRESH', genre: 'симулятор_свидания', img: 'картинке нн (моих сыгранных игр)/warm.png' },
            { id: 'gentle', title: 'Gentle Fall', genre: 'романтика', img: 'картинке нн (моих сыгранных игр)/GENTLE FALL.png' },
            { id: 'TODAY', title: "Today I'll Be Hero", genre: 'фэнтези', img: 'картинке нн (моих сыгранных игр)/TODAY HERO.png' },
            { id: 'SI', title: 'Sweet Instincts', genre: 'хоррор', img: 'картинке нн (моих сыгранных игр)/SI.png' },
            { id: 'shutdown', title: 'shutdown', genre: 'психологический_хоррор', img: 'картинке нн (моих сыгранных игр)/shutdown.png' },
            { id: 'tom', title: 'Tales Of Misteria', genre: 'мистика', img: 'картинке нн (моих сыгранных игр)/tom.png' },
            { id: 'wbd', title: 'We Belong Dead', genre: 'хоррор', img: 'картинке нн (моих сыгранных игр)/WBD.png' },
            { id: 'freddy', title: 'Freddy Fazbear Dating Simulator', genre: 'симулятор_свидания', img: 'картинке нн (моих сыгранных игр)/FREDDY DATSIM.png' },
            { id: 'eulogy', title: 'eulogy', genre: 'приключение', img: 'картинке нн (моих сыгранных игр)/eulogy.png' },
            { id: 'iwtmsb', title: 'I Want To Make Something..', genre: 'short', img: 'картинке нн (моих сыгранных игр)/iwtsb.png' },
            { id: 'Tadc DatSim', title: 'The Amazing Digital DatSim', genre: 'симулятор_свидания', img: 'картинке нн (моих сыгранных игр)/TADC DATSIM.png' },
            { id: 'myo', title: 'Myosotis', genre: 'детектив', img: 'картинке нн (моих сыгранных игр)/myosotis.png' },
        ];

        // 2. Чтение параметров URL (жанр и страница)
        const urlParams = new URLSearchParams(window.location.search);
        let currentPage = parseInt(urlParams.get('page')) || 1;
        const selectedGenre = urlParams.get('genre') || 'all';
        const itemsPerPage = 16; // Можно изменить на 8, если хотите больше страниц

        // 3. ФИЛЬТРАЦИЯ БАЗЫ ДАННЫХ ДО пагинации (Это решает проблему "пропажи" новелл)
        let filteredNovels = novelsDB;
        if (selectedGenre !== 'all' && selectedGenre !== '') {
            filteredNovels = novelsDB.filter(novel => novel.genre === selectedGenre);
        }

        // 4. Расчет пагинации для отфильтрованного списка
        const totalPages = Math.ceil(filteredNovels.length / itemsPerPage);
        
        // Если текущая страница больше, чем всего страниц, возвращаемся на последнюю доступную
        if (currentPage > totalPages && totalPages > 0) {
            currentPage = totalPages;
            urlParams.set('page', currentPage);
            window.history.replaceState({}, '', `${window.location.pathname}?${urlParams.toString()}`);
        }
        if (totalPages === 0) currentPage = 1;

        // 5. Отрисовка карточек
        const container = document.getElementById('catalogContainer');
        container.innerHTML = ''; 
        
        const startIndex = (currentPage - 1) * itemsPerPage;
        const endIndex = startIndex + itemsPerPage;
        const pageItems = filteredNovels.slice(startIndex, endIndex);

        if (pageItems.length === 0) {
            container.innerHTML = '<div class="w-100 text-center py-5" style="color:#d8b4e2; font-size: 1.2rem;">В этом жанре пока нет новелл.</div>';
        } else {
            pageItems.forEach(novel => {
               const cardHTML = `
                <a href="cartchka noveli.html?id=${novel.id}">
                    <div class="cartochki-card" data-genre="${novel.genre}">
                        <img src="${novel.img}" class="cartochki-image" alt="${novel.title}" onerror="this.src='icon.png'">
                        <div class="cartochki-body">
                            <h5 class="cartochki-text">${novel.title}</h5>
                        </div>
                    </div>
                </a>
            `;
                container.innerHTML += cardHTML;
            });
        }

        // 6. Динамическая генерация пагинации
        const paginationList = document.getElementById('paginationList');
        const prevBtn = document.getElementById('prevBtn');
        const nextBtn = document.getElementById('nextBtn');
        
        // Очищаем старые номера страниц, оставляем только Prev и Next
        paginationList.innerHTML = '';
        paginationList.appendChild(prevBtn);

        // Генерируем кнопки страниц (1, 2, 3...) в зависимости от количества отфильтрованных новелл
        for (let i = 1; i <= totalPages; i++) {
            const li = document.createElement('li');
            li.className = `page-item ${i === currentPage ? 'active' : ''}`;
            
            const newParams = new URLSearchParams(urlParams);
            newParams.set('page', i);
            
            li.innerHTML = `<a class="page-link" href="?${newParams.toString()}">${i}</a>`;
            paginationList.appendChild(li);
        }

        paginationList.appendChild(nextBtn);

        // Логика кнопки "Предыдущая"
        const prevLink = prevBtn.querySelector('a');
        if (currentPage <= 1) {
            prevBtn.classList.add('disabled');
            prevLink.removeAttribute('href');
        } else {
            prevBtn.classList.remove('disabled');
            const prevParams = new URLSearchParams(urlParams);
            prevParams.set('page', currentPage - 1);
            prevLink.href = `?${prevParams.toString()}`;
        }

        // Логика кнопки "Следующая"
        const nextLink = nextBtn.querySelector('a');
        if (currentPage >= totalPages || totalPages === 0) {
            nextBtn.classList.add('disabled');
            nextLink.removeAttribute('href');
        } else {
            nextBtn.classList.remove('disabled');
            const nextParams = new URLSearchParams(urlParams);
            nextParams.set('page', currentPage + 1);
            nextLink.href = `?${nextParams.toString()}`;
        }

        // 7. Подсветка активного жанра в выпадающем списке
        const genreLinks = document.querySelectorAll('.dropdown-item[data-genre]');
        genreLinks.forEach(link => {
            if (link.dataset.genre === selectedGenre) {
                link.classList.add('active');
                link.style.fontWeight = 'bold';
                link.style.backgroundColor = '#e9ecef';
            } else {
                link.classList.remove('active');
                link.style.fontWeight = 'normal';
                link.style.backgroundColor = 'transparent';
            }
        });

        // 8. Поиск по текущей странице
        const searchInput = document.getElementById('searchInput');
        const searchBtn = document.getElementById('searchBtn');
        
        function doSearch() {
            const query = searchInput.value.toLowerCase().trim();
            const cards = document.querySelectorAll('.cartochki-card');
            cards.forEach(card => {
                const title = card.querySelector('.cartochki-text').textContent.toLowerCase();
                if (title.includes(query)) {
                    card.parentElement.style.display = 'block';
                } else {
                    card.parentElement.style.display = 'none';
                }
            });
        }
        
        if (searchInput && searchBtn) {
            searchBtn.addEventListener('click', doSearch);
            searchInput.addEventListener('input', doSearch);
        }

        // 9. СОХРАНЕНИЕ ПОЗИЦИИ ПРОКРУТКИ ПРИ ОБНОВЛЕНИИ СТРАНИЦЫ
        // Сохраняем позицию перед закрытием или перезагрузкой
        window.addEventListener('beforeunload', function() {
            sessionStorage.setItem('catalogScrollPosition', window.scrollY);
        });

        // Восстанавливаем позицию при загрузке
        const savedPosition = sessionStorage.getItem('catalogScrollPosition');
        if (savedPosition !== null) {
            // Небольшая задержка, чтобы браузер успел отрисовать элементы
            setTimeout(() => {
                window.scrollTo(0, parseInt(savedPosition, 10));
            }, 100);
        }
    });
    </script>
